version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      # Umbrel auto-prefixes the project name (the app id) when starting the stack.
      APP_HOST: orho-sonarqube_server_1
      APP_PORT: 9000
      # SonarQube can take a few minutes to start — give the proxy a long timeout.
      PROXY_AUTH_ADD: "false"

  server:
    image: sonarqube:community
    restart: on-failure
    stop_grace_period: 1m
    # The SonarQube container ships with an Elasticsearch instance that requires
    # bootstrap checks to be relaxed when running inside Docker, plus a higher
    # vm.max_map_count. The env var below disables the bootstrap checks; the
    # ulimits are required so Elasticsearch can map enough memory.
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${APP_DATA_DIR}/data/sonarqube_data:/opt/sonarqube/data
      - ${APP_DATA_DIR}/data/sonarqube_extensions:/opt/sonarqube/extensions
      - ${APP_DATA_DIR}/data/sonarqube_logs:/opt/sonarqube/logs
